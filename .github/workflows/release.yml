name: Release Serpentis APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave blank to auto-use v<versionName> from app/build.gradle.kts, e.g. v0.1.1)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-apk:
    name: Build & Publish Versioned APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Resolve Release Version Tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          APP_VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$APP_VERSION" ]; then
            echo "Could not detect versionName in app/build.gradle.kts" >&2
            exit 1
          fi

          if [ -n "$INPUT_TAG" ]; then
            RELEASE_TAG="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="v${APP_VERSION}"
          fi

          # Ensure tag begins with 'v'
          case "$RELEASE_TAG" in
            v*) ;;
            *) RELEASE_TAG="v${RELEASE_TAG}" ;;
          esac

          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${RELEASE_TAG}"

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest

      - name: Assemble Versioned APK
        run: |
          gradle :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/serpentis-${{ steps.version.outputs.release_tag }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk dist/serpentis.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: serpentis-${{ steps.version.outputs.release_tag }}-apk
          path: dist/serpentis-${{ steps.version.outputs.release_tag }}.apk

      - name: Generate Release Notes
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          SECTION=$(awk -v ver="$APP_VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)

          {
            echo "## Serpentis ${RELEASE_TAG}"
            echo ""
            if [ -n "$SECTION" ]; then
              echo "$SECTION"
            else
              echo "Automated Android APK release for **Serpentis ${RELEASE_TAG}**."
            fi
            echo ""
            echo "### Download & Install"
            echo "- Download \`serpentis-${RELEASE_TAG}.apk\` below and install on Android 7.0+ (API 24+)."
          } > release_notes.md

      - name: Create or Update GitHub Release (${{ steps.version.outputs.release_tag }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Serpentis ${RELEASE_TAG}" \
              --notes-file release_notes.md \
              --latest
            gh release upload "$RELEASE_TAG" \
              "dist/serpentis-${RELEASE_TAG}.apk" \
              dist/serpentis.apk \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "dist/serpentis-${RELEASE_TAG}.apk" \
              dist/serpentis.apk \
              --target "$GITHUB_SHA" \
              --title "Serpentis ${RELEASE_TAG}" \
              --notes-file release_notes.md \
              --latest
          fi
